name: Sim CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        # Hash-locked (fleet --require-hashes policy, 2026-10-25): the lock
        # covers firmware/requirements-dev.txt (pillow) plus the exact CI tool
        # pins below; any hash mismatch fails the install loudly.
        run: pip install --require-hashes -r firmware/requirements-ci.lock.txt

      - name: Lint (ruff)
        run: python -m ruff check firmware/pod/ firmware/sim/

      - name: Format check (black)
        run: python -m black --check firmware/pod/ firmware/sim/

      - name: Pytest suite
        run: cd firmware && python -m pytest sim/ -v

      - name: CLI scenarios (golden, --no-mms, --no-gps)
        run: |
          cd firmware
          rm -rf sim/outbox
          python sim/run.py | grep -q "mms=True sms=True photos=3"
          rm -rf sim/outbox
          python sim/run.py --no-mms | grep -q "mms=False sms=True photos=3"
          rm -rf sim/outbox
          timeout 120 python sim/run.py --no-gps | grep -q "mms=True sms=True photos=3"
          rm -rf sim/outbox
