name: Sim CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: pip install -r firmware/requirements-dev.txt pytest==9.1.1 ruff==0.17.0 black==26.10.1

      - name: Lint (ruff)
        run: python -m ruff check firmware/pod/ firmware/sim/

      - name: Format check (black)
        run: python -m black --check firmware/pod/ firmware/sim/

      - name: Pytest suite
        run: cd firmware && python -m pytest sim/ -v

      - name: CLI scenarios (golden, --no-mms, --no-gps)
        run: |
          cd firmware
          rm -rf sim/outbox
          python sim/run.py | grep -q "mms=True sms=True photos=3"
          rm -rf sim/outbox
          python sim/run.py --no-mms | grep -q "mms=False sms=True photos=3"
          rm -rf sim/outbox
          timeout 120 python sim/run.py --no-gps | grep -q "mms=True sms=True photos=3"
          rm -rf sim/outbox
